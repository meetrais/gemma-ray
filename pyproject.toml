[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-ray"
version = "0.1.0"
description = "Step-by-step Ray lessons: basics, actor workflows, observability, and GCP deployment"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["ray[default]==2.59.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
gpu = ["torch>=2.6,<3"]

[project.scripts]
gemma-ray = "gemma_ray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: starts a real local Ray runtime"]
